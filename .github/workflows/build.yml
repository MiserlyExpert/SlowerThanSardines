name: Test & Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag to publish (e.g. v0.1.0). Leave empty to just build.'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Code signing turns on automatically once these repository secrets exist (see SIGNING.md).
      SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pillow
      - name: Install PyInstaller
        if: runner.os != 'Windows'
        run: pip install pyinstaller
      - name: Install PyInstaller with a freshly compiled bootloader (fewer antivirus false positives)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
        run: pip install --no-binary pyinstaller pyinstaller
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --onefile --windowed --name SlowerThanSardines --icon assets/icon.png --version-file version_info.txt --exclude-module pkg_resources main.py
      - name: Build
        if: runner.os != 'Windows'
        run: pyinstaller --noconfirm --onefile --windowed --name SlowerThanSardines --icon assets/icon.png --exclude-module pkg_resources main.py
      - name: Code-sign the Windows exe (Azure Artifact Signing)
        if: runner.os == 'Windows' && env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            zip -qr ../SlowerThanSardines-macOS.zip SlowerThanSardines.app
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp SlowerThanSardines.exe ../SlowerThanSardines-Windows.exe
          else
            tar czf ../SlowerThanSardines-Linux.tar.gz SlowerThanSardines
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SlowerThanSardines-${{ runner.os }}
          path: SlowerThanSardines-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Slower Than Sardines ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          body: |
            **Windows:** download `SlowerThanSardines-Windows.exe` and double-click it. No install needed.
            If Windows shows "Windows protected your PC", click **More info → Run anyway**. (This goes away once the game is code-signed and has built up download reputation.)

            **macOS:** download the macOS zip, unzip, right-click the app → Open.
            **Linux:** download the Linux tarball, extract, run `./SlowerThanSardines`.
