name: Test & Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag to publish (e.g. v0.1.0). Leave empty to just build.'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: pyinstaller --noconfirm --onefile --windowed --name SlowerThanSardines --icon assets/icon.png --exclude-module pkg_resources main.py
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            zip -qr ../SlowerThanSardines-macOS.zip SlowerThanSardines.app
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp SlowerThanSardines.exe ../SlowerThanSardines-Windows.exe
          else
            tar czf ../SlowerThanSardines-Linux.tar.gz SlowerThanSardines
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SlowerThanSardines-${{ runner.os }}
          path: SlowerThanSardines-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Slower Than Sardines ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          body: |
            **Windows:** download `SlowerThanSardines-Windows.exe` and double-click it. No install needed.
            (Windows may say "Windows protected your PC" because the game isn't code-signed: click **More info → Run anyway**.)

            **macOS:** download the macOS zip, unzip, right-click the app → Open.
            **Linux:** download the Linux tarball, extract, run `./SlowerThanSardines`.
